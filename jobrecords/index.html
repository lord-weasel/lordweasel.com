<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006EA9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Job Records">
  <title>Job Records</title>
  <link rel="manifest" href="assets/manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Job Records</h1>
    </div>
    <button id="addButton" class="primary">＋ Add job</button>
  </header>

  <main>
    <div id="storageNotice" class="notice" hidden></div>
    <section class="summary" aria-label="Record summary">
      <article><span>All records</span><strong id="totalCount">0</strong></article>
      <article><span>Unpaid</span><strong id="unpaidCount">0</strong></article>
      <article class="urgent"><span>Overdue</span><strong id="overdueCount">0</strong></article>
    </section>

    <section class="workspace">
      <div class="tools">
        <label class="search"><span>Search</span><input id="searchInput" type="search" placeholder="Search every field…" autocomplete="off"></label>
        <label><span>Location</span><select id="locationFilter"><option value="">All locations</option></select></label>
        <label><span>Status</span><select id="statusFilter"><option value="">All statuses</option><option>Paid</option><option>Unpaid</option><option>Overdue</option></select></label>
        <label><span>Sort</span><select id="sortSelect"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="location">Location A–Z</option></select></label>
      </div>
      <div class="actionbar">
        <button id="selectButton" class="secondary">Select</button>
        <div id="selectionActions" hidden><span id="selectionCount">0 selected</span><button id="deleteSelected" class="danger">Delete selected</button><button id="cancelSelect" class="secondary">Cancel</button></div>
        <button id="notifyButton" class="secondary">Enable overdue alerts</button>
      </div>

      <div id="emptyState" class="empty">
        <div class="empty-mark">✓</div><h2>No job records yet</h2><p>Add your first job to begin tracking invoices and payments.</p><button class="primary add-first">Add first job</button>
      </div>
      <div id="noMatches" class="empty" hidden><h2>No matching records</h2><p>Try changing your search or filters.</p><button id="clearFilters" class="secondary">Clear search and filters</button></div>

      <div id="recordsWrap" class="records-wrap" hidden>
        <table>
          <thead><tr><th class="selection-cell"></th><th>Date</th><th>Location</th><th>Invoice</th><th class="money">Cash</th><th>Paid</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="recordRows"></tbody>
        </table>
        <div id="recordCards" class="cards"></div>
      </div>
    </section>
  </main>

  <dialog id="recordDialog">
    <form id="recordForm" method="dialog">
      <header><div><p class="eyebrow">JOB DETAILS</p><h2 id="formTitle">Add job</h2></div><button type="button" id="closeDialog" class="icon-button" aria-label="Close form" title="Close">×</button></header>
      <input id="recordId" type="hidden">
      <div class="form-grid">
        <label>Date <span aria-hidden="true">*</span><input id="dateInput" type="date" required></label>
        <label>Location <span aria-hidden="true">*</span><input id="locationInput" list="locationsList" required autocomplete="off"><datalist id="locationsList"></datalist></label>
        <label>Invoice number <span aria-hidden="true">*</span><input id="invoiceInput" required autocomplete="off"></label>
        <label>Cash <span aria-hidden="true">*</span><input id="cashInput" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="0.00"></label>
        <label class="full paid-control"><input id="paidInput" type="checkbox"> <span>Paid</span></label>
      </div>
      <p class="required-note">* Required field</p>
      <footer><button type="button" id="cancelDialog" class="secondary">Cancel</button><button type="submit" class="primary">Save job</button></footer>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js" defer></script>
</body>
</html>
